name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test Jira intake adapter (offline)
        run: python3 -m unittest discover -s tests/jira_adapter -v

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AiPersonaDemo.sln

      - name: Build
        run: dotnet build AiPersonaDemo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test AiPersonaDemo.sln --configuration Release --no-build --verbosity normal
